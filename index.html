<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Text Animation - PyniWangyy</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #030014;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===================================================
       1. ANIMASI PRELOADER TEKS (WELCOME SCREEN)
       =================================================== */
    #preloader-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #0e0725 0%, #030014 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s ease;
    }

    /* Efek Blur to Focus + Glow Breathing */
    .welcome-text {
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 2px;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 30%, #a855f7 70%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: cinematicFocus 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                 neonPulse 2.5s ease-in-out infinite alternate;
      margin-bottom: 24px;
    }

    .loader-progress-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .loader-track {
      width: 280px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .loader-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #a855f7, #ec4899);
      box-shadow: 0 0 16px #a855f7;
      transition: width 0.1s linear;
    }

    .counter-text {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #94a3b8;
    }

    /* ===================================================
       2. HERO SECTION ANIMASI TEKS
       =================================================== */
    .hero-container {
      max-width: 900px;
      margin: 140px auto 60px;
      padding: 0 24px;
      text-align: center;
    }

    /* Efek Teks "Turning Ideas Into Reality" */
    .hero-title {
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -1.5px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 10%, #e2e8f0 40%, #c084fc 80%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: slideUpFade 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    /* Efek Ketik Dinamis */
    .hero-typewriter {
      font-size: clamp(1.1rem, 3vw, 1.7rem);
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 20px;
      animation: slideUpFade 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
    }

    .typed-word {
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
      border-right: 3px solid #c084fc;
      padding-right: 4px;
      animation: blinkCursor 0.7s step-end infinite;
    }

    .hero-desc {
      font-size: 1rem;
      line-height: 1.7;
      color: #64748b;
      max-width: 600px;
      margin: 0 auto;
      animation: slideUpFade 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
    }

    /* ===================================================
       3. SECTION HEADERS ("ABOUT ME", DLL)
       =================================================== */
    .section-box {
      max-width: 900px;
      margin: 80px auto;
      padding: 0 24px;
      text-align: center;
    }

    .badge-label {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c084fc;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
    }

    /* KEYFRAMES */
    @keyframes cinematicFocus {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(20px);
        filter: blur(12px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0px);
      }
    }

    @keyframes neonPulse {
      0% {
        filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.3));
      }
      100% {
        filter: drop-shadow(0 0 28px rgba(56, 189, 248, 0.7));
      }
    }

    @keyframes slideUpFade {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blinkCursor {
      50% {
        border-color: transparent;
      }
    }
  </style>
</head>
<body>

  <div id="preloader-screen">
    <h1 class="welcome-text">Welcome To My<br>Portfolio Website</h1>
    <div class="loader-progress-wrap">
      <div class="loader-track">
        <div class="loader-fill" id="fillBar"></div>
      </div>
      <div class="counter-text" id="percentText">Loading 0%</div>
    </div>
  </div>

  <header class="hero-container">
    <h1 class="hero-title">Turning Ideas<br>Into Reality</h1>
    <div class="hero-typewriter">
      I'm a <span class="typed-word" id="typedElement"></span>
    </div>
    <p class="hero-desc">
      Pensiunan editor jedag-jedug yang beralih mendalami baris kode, arsitektur web interaktif, dan After Effects motion styling.
    </p>
  </header>

  <section class="section-box">
    <div class="badge-label">Profile Overview</div>
    <h2 class="section-title">About Me</h2>
  </section>

  <script>
    // 1. HITUNG PERSEN PRELOADER (0% -> 100%)
    const fillBar = document.getElementById('fillBar');
    const percentText = document.getElementById('percentText');
    const preloader = document.getElementById('preloader-screen');

    let count = 0;
    const loadTimer = setInterval(() => {
      count += Math.floor(Math.random() * 8) + 4;
      if (count >= 100) {
        count = 100;
        clearInterval(loadTimer);
        setTimeout(() => {
          preloader.style.opacity = '0';
          preloader.style.visibility = 'hidden';
        }, 500);
      }
      fillBar.style.width = count + '%';
      percentText.innerText = 'Loading ' + count + '%';
    }, 45);

    // 2. TYPEWRITER EFFECT
    const words = [
      "Video Editor.",
      "Creative Programmer.",
      "After Effects Stylist.",
      "Motion Explorer."
    ];

    let wordIdx = 0;
    let charIdx = 0;
    let isDeleting = false;
    const target = document.getElementById('typedElement');

    function typeLoop() {
      const currentWord = words[wordIdx];

      if (isDeleting) {
        target.textContent = currentWord.substring(0, charIdx - 1);
        charIdx--;
      } else {
        target.textContent = currentWord.substring(0, charIdx + 1);
        charIdx++;
      }

      let typingSpeed = isDeleting ? 35 : 85;

      if (!isDeleting && charIdx === currentWord.length) {
        typingSpeed = 1600; // jeda diam setelah selesai mengetik
        isDeleting = true;
      } else if (isDeleting && charIdx === 0) {
        isDeleting = false;
        wordIdx = (wordIdx + 1) % words.length;
        typingSpeed = 400; // jeda sebelum mulai kata berikutnya
      }

      setTimeout(typeLoop, typingSpeed);
    }

    // Jalankan efek ketik saat halaman siap
    document.addEventListener('DOMContentLoaded', typeLoop);
  </script>

</body>
</html>
